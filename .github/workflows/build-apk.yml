name: Build Baifan Music APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download source code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find and extract ZIP
        run: |
          mkdir -p source

          ZIP_FILE=$(find . -maxdepth 2 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: File ZIP tidak ditemukan!"
            find . -maxdepth 3 -type f
            exit 1
          fi

          echo "ZIP ditemukan: $ZIP_FILE"
          unzip -o "$ZIP_FILE" -d source

          echo "Isi hasil ekstraksi:"
          find source -maxdepth 3 -type f | head -n 50

      - name: Locate Android project
        run: |
          if [ -f source/settings.gradle.kts ]; then
            echo "PROJECT_DIR=source" >> "$GITHUB_ENV"
          else
            PROJECT=$(find source -name settings.gradle.kts -print -quit)

            if [ -z "$PROJECT" ]; then
              echo "ERROR: settings.gradle.kts tidak ditemukan!"
              exit 1
            fi

            echo "PROJECT_DIR=$(dirname "$PROJECT")" >> "$GITHUB_ENV"
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BaifanMusic-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
